apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: store-api-v1
  namespace: fashionstore
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: store-api-v1 }
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: store-api-v1
  namespace: fashionstore
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: store-api, version: v1 }
