# t3.small (2 vCPU / 2 GiB): spread API pods across the two demo workers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-api-v2
  namespace: fashionstore
spec:
  template:
    spec:
      containers:
        - name: store-api
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 768Mi }
