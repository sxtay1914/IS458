name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: fashionstore

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
      - name: fmt + validate
        run: make validate
      - name: terraform test (mocked AWS, no credentials)
        run: make tf-test

  functions:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fashionstore
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PASSWORD: root
      TEST_DB_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r functions/requirements-dev.txt
      - name: Flyway migrations apply cleanly
        run: make db-migrate
      - name: pytest against real MySQL
        run: make py-test
      - name: package Lambdas
        run: make package

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: render the demo overlay with placeholder outputs
        run: |
          d=platform/kubernetes/overlays/demo/generated
          printf 'AWS_REGION=ap-southeast-1\nDB_HOST=db\n' > "$d/app-config.env"
          printf 'STORE_API_ROLE_ARN=arn:aws:iam::123456789012:role/x\nTG_V1_ARN=arn:a\nTG_V2_ARN=arn:b\nSTORE_API_IMAGE_V1=r:v1\nSTORE_API_IMAGE_V2=r:v2\n' > "$d/terraform-outputs.env"
          kubectl kustomize platform/kubernetes/overlays/demo > /tmp/rendered.yaml
          grep -q 'targetGroupARN: arn:a' /tmp/rendered.yaml
          ! grep -q 'name: terraform-outputs' /tmp/rendered.yaml

  store-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: fashionstore/apps/store-api/pom.xml
      - name: JUnit + Testcontainers MySQL (Docker is preinstalled on the runner)
        run: make api-test
      - name: image builds
        run: docker build -t store-api:ci apps/store-api

  storefront:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            fashionstore/apps/storefront/package-lock.json
            fashionstore/tests/e2e/package-lock.json
      - name: typecheck, vitest, build
        run: make web-test
      - name: Playwright browser
        working-directory: fashionstore/tests/e2e
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: e2e (mocked backend)
        run: make e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: fashionstore/tests/e2e/playwright-report

  load-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: k6 scripts parse (inspect only, no traffic)
        run: |
          echo '["t"]' > tests/load/tokens.json
          for s in browse checkout flash-sale; do
            k6 inspect -e BASE_URL=https://example.invalid tests/load/$s.js >/dev/null
          done
